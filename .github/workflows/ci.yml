name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run checks
        run: composer check

  framework-compatibility:
    name: ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Symfony 6.4 / API Platform 3.4
            php: '8.2'
            framework: symfony
            api_platform: '^3.4'
            symfony: '6.4.*'
          - name: Symfony 7.x / API Platform 4.x
            php: '8.2'
            framework: symfony
            api_platform: '^4.0'
            symfony: '7.*'
          - name: Symfony 8.x / API Platform 4.x
            php: '8.4'
            framework: symfony
            api_platform: '^4.0'
            symfony: '8.*'
          - name: Laravel 11 / API Platform Laravel 4.2
            php: '8.2'
            framework: laravel
            laravel: '^11.0'
            api_platform_laravel: '^4.2'
            testbench: '^9.0'
          - name: Laravel 12 / API Platform Laravel 4.3
            php: '8.2'
            framework: laravel
            laravel: '^12.0'
            api_platform_laravel: '^4.3'
            testbench: '^10.0'
          - name: Laravel 13 / API Platform Laravel 4.3
            php: '8.3'
            framework: laravel
            laravel: '^13.0'
            api_platform_laravel: '^4.3'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Configure Symfony compatibility dependencies
        if: matrix.framework == 'symfony'
        env:
          API_PLATFORM: ${{ matrix.api_platform }}
          SYMFONY: ${{ matrix.symfony }}
        run: |
          composer remove --dev api-platform/laravel laravel/framework orchestra/testbench --no-update
          composer require --no-update "api-platform/metadata:$API_PLATFORM"
          composer require --dev --no-update "symfony/framework-bundle:$SYMFONY"

      - name: Configure Laravel compatibility dependencies
        if: matrix.framework == 'laravel'
        env:
          LARAVEL: ${{ matrix.laravel }}
          API_PLATFORM_LARAVEL: ${{ matrix.api_platform_laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: |
          composer require --dev --no-update \
            "api-platform/laravel:$API_PLATFORM_LARAVEL" \
            "laravel/framework:$LARAVEL" \
            "orchestra/testbench:$TESTBENCH"
          composer config policy.advisories.block false

      - name: Install compatibility dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run Symfony integration tests
        if: matrix.framework == 'symfony'
        run: vendor/bin/phpunit tests/Integration/Symfony

      - name: Run Laravel integration tests
        if: matrix.framework == 'laravel'
        run: vendor/bin/phpunit tests/Integration/Laravel

  lowest-dependencies:
    name: PHP 8.2 / Lowest Symfony-Core Dependencies

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Remove optional Laravel development stack
        run: composer remove --dev api-platform/laravel laravel/framework orchestra/testbench --no-update

      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run lowest-dependency tests
        run: |
          composer validate --strict
          vendor/bin/phpunit tests/Unit
          vendor/bin/phpunit tests/Integration/Symfony
          composer test:behaviour
